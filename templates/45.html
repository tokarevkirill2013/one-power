<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #f5f7fa 0%, #e9edf5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .form-container {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 40px 35px;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      transition: 0.25s ease;
    }

    .form-container:hover {
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #1a2639;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subhead {
      font-size: 15px;
      color: #5e6f8d;
      margin-bottom: 28px;
      border-left: 4px solid #4a6cf7;
      padding-left: 14px;
      background: #f0f4fe;
      border-radius: 0 12px 12px 0;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #2c3a5a;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    label .required {
      color: #e74c5e;
      margin-left: 3px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      background: #f8faff;
      border: 1.5px solid #dce3f0;
      border-radius: 16px;
      transition: 0.2s;
      color: #1a2639;
      font-weight: 450;
      outline: none;
    }

    input:focus {
      border-color: #4a6cf7;
      background: white;
      box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.12);
    }

    input::placeholder {
      color: #9aabbf;
      font-weight: 400;
      font-size: 14px;
    }

    .hint {
      font-size: 13px;
      color: #6a7b96;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint svg {
      opacity: 0.6;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #1a2639;
      color: white;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #1e2b41 0%, #2a3b5e 100%);
      box-shadow: 0 8px 18px rgba(26, 38, 57, 0.2);
    }

    button:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #25344f 0%, #32466e 100%);
      box-shadow: 0 12px 24px rgba(26, 38, 57, 0.3);
    }

    button:active {
      transform: scale(0.98);
    }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
      color: #7a8aa3;
      border-top: 1px solid #eef3fc;
      padding-top: 20px;
    }

    .footer-note span {
      background: #eef3fc;
      padding: 2px 10px;
      border-radius: 30px;
      font-weight: 500;
      color: #1a2639;
    }

    @media (max-width: 500px) {
      .form-container {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>📝 Создать аккаунт</h1>
    <div class="subhead">
      Заполните форму — пароль должен быть не менее 10 символов
    </div>

    <form action="/answer" method="post">
      <div class="form-group">
        <label for="name">Имя <span class="required">*</span></label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Алексей Иванов"
          required
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="email">Электронная почта <span class="required">*</span></label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="alex@example.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Пароль <span class="required">*</span></label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="минимум 10 символов"
          required
          autocomplete="new-password"
          minlength="10"
        >
        <div class="hint">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5e6f8d" stroke-width="2">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-linecap="round"/>
            <path d="M12 16v-4" stroke-linecap="round"/>
            <circle cx="12" cy="10" r="1" fill="#5e6f8d" stroke="none"/>
          </svg>
          <span>Длина должна быть ≥ 10 символов</span>
        </div>
      </div>

      <div class="form-group">
        <label for="age">Возраст <span class="required">*</span></label>
        <input
          type="number"
          id="age"
          name="age"
          placeholder="25"
          required
          min="1"
          max="130"
          autocomplete="off"
        >
      </div>

      <button type="submit">Зарегистрироваться</button>
    </form>

    <div class="footer-note">
      <span>🔒</span> Данные отправляются на сервер FastAPI
    </div>
  </div>
</body>
</html>
