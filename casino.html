
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Казино</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:linear-gradient(135deg,#1a0a0a,#2d0a0a);min-height:100vh;padding:20px;}
.container{max-width:800px;margin:0 auto;}
h1{color:#ffd700;text-align:center;margin-bottom:20px;}
.back-btn{display:inline-block;padding:10px 20px;background:#ffd700;color:#1a0a0a;text-decoration:none;border-radius:8px;font-weight:bold;margin-bottom:20px;}
.back-btn:hover{transform:scale(1.05);}
.balance{color:#ffd700;text-align:center;font-size:2em;margin-bottom:15px;}
.slots{display:flex;justify-content:center;gap:15px;font-size:4em;padding:20px;background:rgba(0,0,0,0.3);border-radius:15px;margin:20px 0;}
.slot{transition:all 0.3s;}
.spinning{animation:spin 0.1s ease-in-out infinite;}
.winner{animation:win 0.5s ease-in-out;}
@keyframes spin{50%{transform:scale(1.3) rotate(10deg);}}
@keyframes win{50%{transform:scale(1.5);text-shadow:0 0 50px gold;}}
.bet-controls{text-align:center;margin:10px 0;}
.bet-controls input{padding:10px;border-radius:8px;border:2px solid #ffd70044;background:rgba(0,0,0,0.3);color:#ffd700;width:150px;}
.btn{padding:12px 25px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s;color:#1a0a0a;text-transform:uppercase;}
.btn-spin{background:linear-gradient(135deg,#ffd700,#f0a500);}
.btn-spin:hover{transform:scale(1.05);}
.btn-spin:disabled{opacity:0.5;cursor:not-allowed;}
.btn-reset{background:linear-gradient(135deg,#ff4444,#cc0000);color:white;}
.btn-reset:hover{transform:scale(1.05);}
.message-box{padding:15px;border-radius:8px;margin:10px 0;text-align:center;font-weight:bold;}
.message-box.win{background:rgba(255,215,0,0.2);color:#ffd700;border:1px solid #ffd70044;}
.message-box.lose{background:rgba(255,0,0,0.2);color:#ff6666;border:1px solid #ff000044;}
.message-box.info{background:rgba(68,170,255,0.2);color:#66bbff;border:1px solid #44aaff44;}
</style>
</head>
<body>
<div class="container">
<a href="index.html" class="back-btn">← Назад</a>
<h1>🎰 КАЗИНО</h1>
<div class="balance">💰 Баланс: <span id="balance">1000</span></div>
<div class="slots"><div class="slot" id="s1">🍒</div><div class="slot" id="s2">🍒</div><div class="slot" id="s3">🍒</div></div>
<div class="bet-controls">
<input type="number" id="betAmount" value="50" min="10" step="10">
<button class="btn btn-spin" onclick="spinSlots()">🎰 КРУТИТЬ</button>
<button class="btn btn-reset" onclick="resetGame()">🔄 Сброс</button>
</div>
<div id="slotMessage" class="message-box info">Нажми "КРУТИТЬ"</div>
<script>
const SYMBOLS=['🍒','🍋','🍊','🍇','💎','⭐','🎰','🎯','🏆'];
const PAYOUTS={0:2,1:2,2:2,3:2,4:10,5:5,6:20,7:3,8:8};
let balance=1000;
function updateBalance(){
document.getElementById('balance').textContent=balance;
localStorage.setItem('game_balance',balance);
}
function spinSlots(){
const bet=parseInt(document.getElementById('betAmount').value);
if(isNaN(bet)||bet<=0||bet>balance){
document.getElementById('slotMessage').textContent='❌ Недостаточно средств!';
document.getElementById('slotMessage').className='message-box lose';
return;
}
balance-=bet;
updateBalance();
const results=[Math.floor(Math.random()*SYMBOLS.length),Math.floor(Math.random()*SYMBOLS.length),Math.floor(Math.random()*SYMBOLS.length)];
document.getElementById('s1').textContent=SYMBOLS[results[0]];
document.getElementById('s2').textContent=SYMBOLS[results[1]];
document.getElementById('s3').textContent=SYMBOLS[results[2]];
let winAmount=0,msg='',type='lose';
const isJackpot=results[0]===6&&results[1]===6&&results[2]===6;
const isWin=results[0]===results[1]&&results[1]===results[2];
if(isJackpot){winAmount=bet*50;msg=`🎰 ДЖЕКПОТ! +${winAmount}₽`;type='win';}
else if(isWin){let mult=PAYOUTS[results[0]]||2;winAmount=bet*mult;msg=`🎉 ВЫИГРЫШ! x${mult}=+${winAmount}₽`;type='win';}
else{msg=`😢 Проигрыш -${bet}₽`;type='lose';}
balance+=winAmount;updateBalance();
document.getElementById('slotMessage').textContent=msg;
document.getElementById('slotMessage').className='message-box '+type;
}
function resetGame(){
if(!confirm('Сбросить игру?'))return;
balance=1000;updateBalance();
document.getElementById('s1').textContent='🍒';
document.getElementById('s2').textContent='🍒';
document.getElementById('s3').textContent='🍒';
document.getElementById('slotMessage').textContent='🔄 Игра сброшена';
document.getElementById('slotMessage').className='message-box info';
}
const saved=localStorage.getItem('game_balance');
if(saved){balance=parseInt(saved);updateBalance();}
</script>
</div>
</body>
</html>
