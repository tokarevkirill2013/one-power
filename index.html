
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 ИГРОВОЙ ПОРТАЛ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:linear-gradient(135deg,#0a0a1a,#1a0a2a);min-height:100vh;padding:20px;}
.container{max-width:1200px;margin:0 auto;}
h1{color:#ffd700;text-align:center;margin-bottom:30px;font-size:2.5em;text-shadow:0 0 20px rgba(255,215,0,0.3);}
.balance{color:#ffd700;text-align:center;font-size:1.5em;padding:10px;background:rgba(0,0,0,0.3);border-radius:10px;margin-bottom:15px;}
.game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:20px 0;}
.game-card{background:rgba(30,10,10,0.9);padding:30px 20px;border-radius:15px;text-align:center;border:2px solid #ffd70033;cursor:pointer;transition:all 0.3s;text-decoration:none;color:inherit;}
.game-card:hover{transform:scale(1.05);border-color:#ffd700;background:rgba(255,215,0,0.1);}
.game-card .icon{font-size:4em;}
.game-card .name{color:#ffd700;font-weight:bold;font-size:1.2em;margin-top:10px;}
.game-card .desc{color:#aa8866;font-size:14px;margin-top:5px;}
@media(max-width:768px){.game-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="container">
<h1>🎮 ИГРОВОЙ ПОРТАЛ</h1>
<div class="balance">💰 Баланс: <span id="balance">1000</span></div>
<div class="game-grid">
<a href="casino.html" target="_blank" class="game-card"><div class="icon">🎰</div><div class="name">Казино</div><div class="desc">Слоты с джекпотом</div></a>
<a href="chess.html" target="_blank" class="game-card"><div class="icon">♟️</div><div class="name">Шахматы с ИИ</div><div class="desc">Играйте против компьютера</div></a>
<a href="tictac.html" target="_blank" class="game-card"><div class="icon">❌⭕</div><div class="name">Крестики-нолики</div><div class="desc">Игра против компьютера</div></a>
<a href="randomizer.html" target="_blank" class="game-card"><div class="icon">🎲</div><div class="name">Рандомайзер</div><div class="desc">Генератор случайных чисел</div></a>
<a href="clicker.html" target="_blank" class="game-card"><div class="icon">🖱️</div><div class="name">Кликер</div><div class="desc">Зарабатывай кликами</div></a>
<a href="dino.html" target="_blank" class="game-card"><div class="icon">🦕</div><div class="name">Динозаврик</div><div class="desc">Прыгай и беги!</div></a>
<a href="plague.html" target="_blank" class="game-card"><div class="icon">🦠</div><div class="name">Plague Inc</div><div class="desc">Заражай мир!</div></a>
</div>
</div>
<script>
let balance=1000;
function updateBalance(){document.getElementById('balance').textContent=balance;}
const saved=localStorage.getItem('game_balance');
if(saved){balance=parseInt(saved);updateBalance();}
setInterval(()=>{
const saved2=localStorage.getItem('game_balance');
if(saved2){balance=parseInt(saved2);updateBalance();}
},1000);
</script>
</body>
</html>
